name: LightCraft baseline APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lightcraft-baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure JDK
        run: |
          sudo mkdir -p /opt/jdk
          sudo ln -s "$JAVA_HOME" /opt/jdk/temurin-21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build unmodified baseline (AI denoise not fixed)
        env:
          ARTCRAFT_BUILD_TOOLS_VERSION: '35.0.0'
        run: |
          set -o pipefail
          mkdir -p logs output
          bash build-debug.sh -lightcraft -tag=v0.14.0 -appname=LightCraft-Baseline-Test -packagename=com.artcraft.lightcraft.baselinetest 2>&1 | tee logs/baseline-console.log
      - name: Check APK archive integrity
        run: |
          shopt -s nullglob
          apks=(output/*.apk)
          test ${#apks[@]} -gt 0
          for apk in "${apks[@]}"; do unzip -tq "$apk"; done
      - name: Upload baseline APK
        uses: actions/upload-artifact@v4
        with:
          name: lightcraft-0.14.0-baseline-not-denoise-fixed
          path: output/*.apk
          if-no-files-found: error
      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightcraft-baseline-diagnostics
          path: |
            logs/
            source/lightcraft/apps/lightcraft-android/src/
            source/lightcraft/apps/lightcraft-android/Cargo.toml
            source/lightcraft/crates/ui-egui/src/lib.rs
            source/lightcraft/crates/denoise/Cargo.toml
            source/lightcraft/crates/engine/Cargo.toml
          if-no-files-found: warn
